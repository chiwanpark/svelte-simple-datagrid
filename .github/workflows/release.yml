name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version pull request
    if: github.repository == 'chiwanpark/svelte-simple-datagrid'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: pnpm/setup@v3
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Open or update version pull request
      uses: changesets/action@v2
      with:
        version-script: pnpm release:version
        commit-message: 'chore(release): version packages'
        pr-title: 'chore(release): version packages'
        create-github-releases: false
        push-git-tags: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Stage on npm and release
    needs: version
    if: github.repository == 'chiwanpark/svelte-simple-datagrid'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: pnpm/setup@v3
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        registry-url: https://registry.npmjs.org
    - name: Update npm for trusted publishing
      run: npm install --global npm@latest
    - run: pnpm install --frozen-lockfile
    - name: Resolve release state
      id: state
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        name=$(node -p 'require("./package.json").name')
        version=$(node -p 'require("./package.json").version')
        published=$(npm view "$name@$version" version 2>/dev/null || true)
        release=$(gh release view "v$version" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo missing)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if [ -z "$published" ] && [ "$release" = missing ]; then
          echo "Version $version is not on npm, staging it."
          echo "action=stage" >> "$GITHUB_OUTPUT"
        elif [ -z "$published" ] && [ "$release" = draft ]; then
          echo "Version $version is staged and waiting for approval with npm stage approve."
          echo "action=none" >> "$GITHUB_OUTPUT"
        elif [ "$release" = draft ]; then
          echo "Version $version is approved on npm, publishing the GitHub release."
          echo "action=release" >> "$GITHUB_OUTPUT"
        else
          echo "Nothing to do for version $version (npm: ${published:-not published}, GitHub release: $release)."
          echo "action=none" >> "$GITHUB_OUTPUT"
        fi
    - name: Stage package
      if: steps.state.outputs.action == 'stage'
      env:
        VERSION: ${{ steps.state.outputs.version }}
      run: |
        set -o pipefail
        npm stage publish | tee /tmp/stage.log
        stage_id=$(sed -n 's/^+ .* (staged with id \(.*\))$/\1/p' /tmp/stage.log)
        {
          echo "Version $VERSION is staged on npm. Approve it with 2FA:"
          echo
          echo '```sh'
          echo "npm stage approve ${stage_id:-<stage-id>}"
          echo 'gh workflow run release.yml'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Create draft GitHub release
      if: steps.state.outputs.action == 'stage'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.state.outputs.version }}
      run: |
        : > /tmp/release-notes.md
        if [ -f CHANGELOG.md ]; then
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
        fi
        if [ -s /tmp/release-notes.md ]; then
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes-file /tmp/release-notes.md
        else
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        fi
    - name: Publish GitHub release
      if: steps.state.outputs.action == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.state.outputs.version }}
      run: gh release edit "v$VERSION" --draft=false
