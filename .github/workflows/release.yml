name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version pull request
    if: github.repository == 'chiwanpark/svelte-simple-datagrid'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update version pull request
        uses: changesets/action@v2
        with:
          version-script: pnpm release:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: version
    if: github.repository == 'chiwanpark/svelte-simple-datagrid'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Resolve release state
        id: state
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$published" ]; then
            echo "Version $version is already on npm, skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version is not on npm, publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.state.outputs.publish == 'true'
        run: npm publish
      - name: Push git tag
        if: steps.state.outputs.publish == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm release:tag
          git push --tags
      - name: Create GitHub release
        if: steps.state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          : > /tmp/release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v version="$VERSION" '
              $0 == "## " version { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > /tmp/release-notes.md
          fi
          if [ -s /tmp/release-notes.md ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/release-notes.md
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
